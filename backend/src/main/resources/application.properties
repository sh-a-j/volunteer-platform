spring.application.name=volunteer

# ─── Database Configuration ──────────────────────────────────────────────────
# HOW THIS WORKS:
#   ${DB_URL:fallback}  means: use env variable DB_URL if set, else use fallback
#
#   Local (npm run dev or Docker):  uses mysql:3306 fallback
#   Render (cloud):                 uses DB_URL env variable you set in Render dashboard
#
spring.datasource.url=${DB_URL:jdbc:mysql://roundhouse.proxy.rlwy.net:22675/railway?useSSL=true&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:AZNYdOdcdxvFwISxjQbVjPOkFADoqgZB}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Wait for DB to be ready
spring.datasource.hikari.initializationFailTimeout=60000
spring.datasource.hikari.connection-timeout=30000

# ─── JPA Configuration ───────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ─── Server ──────────────────────────────────────────────────────────────────
# Render sets PORT env variable automatically — fall back to 8080 locally
server.port=${PORT:8080}
