server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ─── React Router fix ────────────────────────────────────────────────────
    # Serve index.html for ALL routes so React Router handles navigation.
    # Without this, refreshing /events or /organizer gives nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Gzip for faster page loads ──────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/javascript text/javascript;
}
