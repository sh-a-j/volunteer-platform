name: CI/CD Pipeline — Micro Volunteer Platform

# Trigger on every push to main, and on pull requests to main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1 — BUILD & TEST BACKEND
  # Rubric Criterion 3 (Automated Build) + Criterion 4 (CI Testing)
  # ═══════════════════════════════════════════════════════════════════════════
  build-backend:
    name: Build + Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Criterion 3 — Automated Build
      - name: Build Backend with Maven
        run: |
          cd backend
          mvn clean compile -DskipTests

      # Criterion 4 — Run JUnit Tests (uses H2 in-memory DB, no MySQL needed)
      - name: Run JUnit Tests
        run: |
          cd backend
          mvn test -Dspring.profiles.active=test

      # Upload test report so it shows in GitHub Actions tab
      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-test-results
          path: backend/target/surefire-reports/

      # Package JAR for the Docker build stage
      - name: Package JAR
        run: |
          cd backend
          mvn package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2 — BUILD FRONTEND
  # Rubric Criterion 3 (Automated Build)
  # ═══════════════════════════════════════════════════════════════════════════
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          cd frontend
          npm install

      # Build using the Render backend URL injected from GitHub Secret
      - name: Build React App
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3 — DEPLOY TO RENDER (STAGING)
  # Rubric Criterion 6 (Deployment to Staging with Automated Pipeline)
  #
  # This job runs ONLY when:
  #   - Both Job 1 and Job 2 pass successfully
  #   - The push is to the main branch (not a pull request)
  # ═══════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to Render Staging
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Trigger backend deployment on Render via Deploy Hook URL
      - name: Deploy Backend to Render
        run: |
          echo "Triggering backend deployment..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}")
          echo "Backend deploy hook response: HTTP $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "201" ]; then
            echo "Warning: Unexpected status code $STATUS"
          fi

      # Small wait so Render registers the backend deploy before frontend
      - name: Wait briefly between deploys
        run: sleep 5

      # Trigger frontend deployment on Render via Deploy Hook URL
      - name: Deploy Frontend to Render
        run: |
          echo "Triggering frontend deployment..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}")
          echo "Frontend deploy hook response: HTTP $STATUS"

      # Print live URLs in the Actions log for easy access
      - name: Print Deployment URLs
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  DEPLOYMENT TRIGGERED SUCCESSFULLY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Backend  : https://micro-volunteer-backend.onrender.com"
          echo "  Frontend : https://micro-volunteer-frontend.onrender.com"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Allow 2-3 minutes for Render to finish building."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
