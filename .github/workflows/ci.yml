name: CI/CD Pipeline — Micro Volunteer Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ───────────── BACKEND BUILD + TEST ─────────────
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Backend
        run: |
          cd backend
          mvn clean install

  # ───────────── FRONTEND BUILD ─────────────
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies & Build Frontend
        run: |
          cd frontend

          # 🔥 FIX: Rollup optional dependency bug (VERY IMPORTANT)
          rm -rf node_modules package-lock.json

          npm install --include=optional

          npm run build

  # ───────────── DEPLOY TO RENDER ─────────────
  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]

    steps:
      - name: Trigger Backend Deploy on Render
        run: curl -X POST ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}

      - name: Trigger Frontend Deploy on Render
        run: curl -X POST ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}